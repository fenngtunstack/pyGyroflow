[package]
name = "telemetry-parser-bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "telemetry_parser_bridge"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
telemetry-parser = { git = "https://github.com/AdrianEddy/telemetry-parser.git", rev = "2f4218b" }
serde_json = "1.0"
