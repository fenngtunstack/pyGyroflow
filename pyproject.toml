[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygyroflow"
version = "0.1.0"
description = "Python port of Gyroflow video stabilization — production-grade, bit-exact algorithms"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
    { name = "PyGyroFlow Contributors" },
]
readme = "README.md"

dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "wgpu>=0.18",
    "av>=13.0",
    "opencv-python>=4.10",
    "pillow>=10.0",
    "cbor2>=5.6",
    "PySide6>=6.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-xdist",
    "mypy",
    "ruff",
]
torch = [
    "torch>=2.3",
]

[project.scripts]
pygyroflow = "pygyroflow.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: end-to-end tests that encode/decode real video (several seconds each)",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Conservative baseline: errors, pyflakes, warnings, import sorting, pyupgrade.
# Extend as the codebase matures; do not add style rules that would churn
# existing code without value.
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line length handled by line-length above; not enforced as error
    "E402",  # module-level imports after code (common in __init__ with lazy imports)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
