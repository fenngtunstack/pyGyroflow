name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check pygyroflow tests
        continue-on-error: true  # baseline rules newly added; allow first runs to surface issues without blocking

      - name: Type check (mypy)
        run: mypy pygyroflow
        continue-on-error: true  # mypy coverage is partial; warn but don't block yet

      - name: Test (pytest)
        run: pytest tests/ -q
